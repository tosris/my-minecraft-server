    <link rel="stylesheet" href="../styles.css">
    <link rel="icon" type="image/png" href="../image/favicon.png"> 
    <title>Galleri • Four Quarters</title>
</head>
<body>

        <header class="banner">
            <nav>
                <div class="menu-toggle" id="menu-toggle">&#9776;</div> 
                <ul class="menu" id="menu">
                    <li><a href="../">Startsida</a></li>
                    <li><a href="../handbook/">Handbok</a></li>
                    <li><a href="https://mc.4qs.se/map">Livekarta</a></li>
                    <li><a href="https://mc.4qs.se/stats">Statistik</a></li>
                    <li><a href="https://forms.office.com/r/XSsVL5F9pT">Whitelist</a></li>
                </ul>
            </nav>
            <a href="../" class="logo-link">
            <div class="logo-container">
                <img src="../image/favicon.png" alt="Server Logo" class="logo">
                <h1>Four Quarters</h1>
            </a>
            </div>
        </header>
        <section>
            <section id="gallery" class="image-gallery">

            </section>
            <div id="imageModal" class="image-modal">
                <span class="close">&times;</span>
                <img class="modal-content" id="modalImg">
            </div>
    </div>
    <footer>
    <div class="footer-content-handbook">Four Quarters © 2025</div>
    <div class="footer-content-handbook">Not approved, official or associated with Mojang or Microsoft</div>
    </footer>
    <script>
    document.getElementById("menu-toggle").addEventListener("click", function() {
        var menu = document.getElementById("menu");
        menu.classList.toggle("show"); 
    });

    const modal = document.getElementById("imageModal");
    const modalImg = document.getElementById("modalImg");
    const closeBtn = document.querySelector(".image-modal .close");

    document.querySelectorAll(".gallery-item img").forEach(img => {
        img.addEventListener("click", () => {
            modal.style.display = "block";
            modalImg.src = img.src;
        });
    });

    closeBtn.onclick = function () {
        modal.style.display = "none";
    }

    window.onclick = function (event) {
        if (event.target === modal) {
            modal.style.display = "none";
        }
    }


    </script>
</body>
</html>
