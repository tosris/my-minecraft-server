        <section>
            <h2>Välkommen in!</h2>

            <!-- Slideshow Section -->
            <div class="slideshow-container">
                <div class="slide fade active">
                    <img src="image1.jpg" alt="Image 1" style="width:100%">
                </div>

                <div class="slide fade">
                    <img src="image2.jpg" alt="Image 2" style="width:100%">

                <div class="slide fade">
                    <img src="image3.jpg" alt="Image 3" style="width:100%">

                    <video autoplay loop muted>
                    <source src="blixt.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
                </div>

                <div class="dots-container">
                    <span class="dot" onclick="currentSlide(1)"></span>

           <!-- <ul class="fun-list">

            </ul>-->
        </section>
    </div>

    <script>
       let slideIndex = 1; // Start at the first slide
        showSlides(slideIndex);

        // Function to show the current slide
        function showSlides(n) {
            let slides = document.getElementsByClassName("slide");
            let dots = document.getElementsByClassName("dot");
            let videos = document.getElementsByClassName("slide-video");
            if (n > slides.length) {slideIndex = 1} // Loop back to first slide
            if (n < 1) {slideIndex = slides.length} // Loop back to last slide
            for (let i = 0; i < slides.length; i++) {
                slides[i].style.display = "none";  
                // Pause all videos when slide is not active
                if (videos[i]) videos[i].pause();
            }
            for (let j = 0; j < dots.length; j++) {
                dots[j].className = dots[j].className.replace(" active", "");
            }
            slides[slideIndex - 1].style.display = "block";  
            dots[slideIndex - 1].className += " active"; // Mark the current dot as active
            // Play the video in the active slide
            if (videos[slideIndex - 1]) videos[slideIndex - 1].play();
        }

        // Function to change slides
        function changeSlide(n) {
            showSlides(slideIndex += n);
        }

        // Function to set the current slide based on dot click
        function currentSlide(n) {
            showSlides(slideIndex = n);
        }

        // Automatic slideshow
        setInterval(function() {
            showSlides(slideIndex += 1);
        }, 15000); // Change image every 5 seconds
    </script>
</body>
